<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prashant Kushwah — Personal Platform & Project Hub</title>
    <meta name="description" content="Personal website, digital portfolio, journey tracker, goals showcase, and software project repository hub for Prashant Kushwah." />
    <meta property="og:title" content="Prashant Kushwah — Personal Platform & Project Hub" />
    <meta property="og:description" content="Learning. Building. Improving. Software projects, releases, documentation, journey, and personal updates." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pk_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0A0B0E] dark:text-slate-100 antialiased selection:bg-blue-600/20 selection:text-blue-600 dark:selection:bg-blue-500/30 dark:selection:text-blue-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
